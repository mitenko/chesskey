<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <title>Options</title>
</head>
<body class="chesskey-option-body">
    <div id="content" class="chesskey-option-content">
        <hr>
        <h3 class="chesskey-option-h3">Number of puzzles to unlock games</h3>
        <input type="text" id="target-puzzle" name="target-puzzle" class="chesskey-option-input" size="4">

        <hr>
        
        <h3>Disable blitz games</h3>
        <input type="checkbox" id="disable-blitz" class="chesskey-option-input" name="disable-blitz">

        <hr>

    </div>
    <button id="save" class="chesskey-option-btn">Save</button>
</body>

</html>
